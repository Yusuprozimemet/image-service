# Local development services. Spring Boot's spring-boot-docker-compose module
# starts this automatically on `./mvnw spring-boot:run` and wires the Postgres
# datasource into the app via @ServiceConnection — no spring.datasource.* config
# needed for local dev. Values match .env.
services:
  postgres:
    image: 'postgres:16'
    environment:
      POSTGRES_DB: imagedb
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
