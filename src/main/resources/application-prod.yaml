# Production. Secrets never live here — they arrive as env vars
# (SPRING_DATASOURCE_URL/USERNAME/PASSWORD, bound by application.yaml).
#
# Logs are emitted as ECS JSON on the console: once a machine (Loki/Grafana),
# not a human at a terminal, is reading them, structured fields beat prose.
logging:
  level:
    root: INFO
    org.springframework.web: WARN
    org.apache.catalina: WARN
  structured:
    format:
      console: ecs
