spring:
  application:
    name: image-service
  servlet:
    multipart:
      # A bit above our own 10 MB check.
      max-file-size: 11MB
      max-request-size: 12MB
  datasource:
    # Defaults let the app run locally; env vars override.
    url: '${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/imagedb}'
    username: '${SPRING_DATASOURCE_USERNAME:dev}'
    password: '${SPRING_DATASOURCE_PASSWORD:dev}'
  task:
    execution:
      # The @Async pool that runs AI tagging (see AsyncConfig).
      pool:
        # Tagging is one slow HTTPS call, so concurrency is limited by Gemini's
        # rate limit, not by CPU. core-size is the real concurrency: the pool only
        # grows towards max-size once the queue is full.
        core-size: 2
        max-size: 4
        # Absorbs upload bursts. When this fills too, ImageService logs and leaves
        # the image PENDING rather than failing an upload that already succeeded.
        queue-capacity: 100
      # Makes tagging work obvious in the logs, next to the http-nio- threads.
      thread-name-prefix: tagging-
      shutdown:
        # Let tagging in flight finish on shutdown instead of stranding rows at PENDING.
        await-termination: true
        await-termination-period: 30s
server:
  # Use PORT if set, else 8080.
  port: '${PORT:8080}'
app:
  b2:
    # Backblaze B2 storage. Keys/bucket come from env vars; unset is fine
    # (storage just won't work until they're set).
    endpoint: '${B2_ENDPOINT:https://s3.us-west-004.backblazeb2.com}'
    region: '${B2_REGION:us-west-004}'
    bucket: '${B2_BUCKET:}'
    access-key: '${B2_ACCESS_KEY:}'
    secret-key: '${B2_SECRET_KEY:}'
  gemini:
    # Gemini, used to tag images. Key comes from an env var; unset is fine
    # (tagging just won't work until it's set).
    api-key: '${LLM_API_KEY:}'
    # Alias for Google's current flash model.
    model: '${GEMINI_MODEL:gemini-flash-latest}'
    base-url: '${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}'
