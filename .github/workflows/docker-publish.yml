name: Publish Docker image

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Job-level env so the deploy step's `if` can test it; the `secrets`
      # context is not available in step conditions.
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}

    steps:
    - uses: actions/checkout@v7

    - uses: docker/setup-buildx-action@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        context: .
        # Render only runs linux/amd64 images.
        platforms: linux/amd64
        push: true
        # GHCR image names must be lowercase, so this is not ${{ github.repository }}.
        tags: |
          ghcr.io/yusuprozimemet/image-service:latest
          ghcr.io/yusuprozimemet/image-service:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # Image-backed Render services do not redeploy on their own when a tag moves.
    - name: Trigger Render deploy
      if: env.RENDER_DEPLOY_HOOK != ''
      run: curl -fsSL "$RENDER_DEPLOY_HOOK"
