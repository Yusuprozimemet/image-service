name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Java
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'

    # Fast static-analysis gate. Runs before the tests so a style violation
    # fails the build quickly, without waiting for the (slower) test suite.
    - name: Lint (Checkstyle)
      run: ./mvnw checkstyle:check --batch-mode

    - name: Build and test with Maven
      run: ./mvnw clean package --batch-mode